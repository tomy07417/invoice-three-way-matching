[project]
name = "invoice-three-way-matching-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0.128,<0.129",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.40,<0.41",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
